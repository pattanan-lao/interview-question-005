server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the browser only ever talks to this origin.
    # Same-origin means no CORS preflight and no baked-in backend hostname.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback: the Angular router owns /ticket and /clear, so a hard
    # refresh on those paths must still be served index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
